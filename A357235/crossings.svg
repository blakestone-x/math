<svg xmlns="http://www.w3.org/2000/svg" width="920" height="516" viewBox="0 0 920 516" role="img" aria-labelledby="title desc">
<title id="title">A triple crossing in the square separates in the pentagon</title>
<desc id="desc">With corner parameters 2/3 and 5/6 at B, and 1/2 at C, the upper diagrams show the three full segments. Below, the black point indicates the square triple and three black points mark the pentagon pairwise intersections.</desc>
<rect width="920" height="516" fill="white"/>
<line x1="28.0000" y1="26.0000" x2="59.0000" y2="26.0000" stroke="#146e77" stroke-width="3.1" stroke-linecap="round"/>
<text x="69" y="31" font-family="system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#253849">At B, fraction 2/3</text>
<line x1="296.0000" y1="26.0000" x2="327.0000" y2="26.0000" stroke="#9c5518" stroke-width="3.1" stroke-linecap="round"/>
<text x="337" y="31" font-family="system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#253849">At B, fraction 5/6</text>
<line x1="569.0000" y1="26.0000" x2="600.0000" y2="26.0000" stroke="#76559a" stroke-width="3.1" stroke-linecap="round"/>
<text x="610" y="31" font-family="system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#253849">At C, fraction 1/2</text>
<rect x="24" y="54" width="424" height="438" rx="8" fill="#fbfcfd" stroke="#dae0e4"/>
<text x="42" y="83" font-family="system-ui, sans-serif" font-size="19" font-weight="650" text-anchor="start" fill="#253849">Regular square</text>
