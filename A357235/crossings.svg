<line x1="155.0000" y1="213.3333" x2="264.3333" y2="268.0000" stroke="#146e77" stroke-width="2.25" stroke-linecap="round"/>
<line x1="155.0000" y1="240.6667" x2="291.6667" y2="268.0000" stroke="#9c5518" stroke-width="2.25" stroke-linecap="round"/>
<line x1="237.0000" y1="268.0000" x2="319.0000" y2="186.0000" stroke="#76559a" stroke-width="2.25" stroke-linecap="round"/>
<text x="147.0" y="285.0" font-family="system-ui, sans-serif" font-size="13" font-weight="650" text-anchor="start" fill="#253849">B</text>
