version: v0.4
project:
  name: The ternary one-edit recurrence for OEIS A081732
  description: For each nonnegative integer n, count the distinct integers reachable by one insertion,
    deletion or substitution in its canonical base-three numeral. For n at least 9, appending a ternary
    digit increases the count by four if it repeats the last digit, and by five otherwise. This gives
    all nine recurrences conjectured by Zhuorui He.
  authors:
  - Blake Stone
  license: CC-BY-4.0
  responsible_maintainers:
  - Blake Stone
sources:
- title: The ternary one-edit recurrence for OEIS A081732 (written proof)
  id: https://github.com/blakestone-x/math/blob/df67667e4352ec4a2c52cae91bf099d319d9dc63/A081732/README.md
  authors:
  - Blake Stone
  relationship: formalizes
  note: Proof developed with OpenAI Astra 6.2. This earlier public version contains the mathematical
    argument.
- title: OEIS A081732
  id: https://oeis.org/A081732
  contributors:
