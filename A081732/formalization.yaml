    role: conjecture proposer
  type: other
  relationship: background
  note: The entry supplies the original conjecture and defines the sequence.
- title: OEIS A080950, the binary one-edit sequence
  id: https://oeis.org/A080950
  contributors:
  - name: Robert Israel
    role: binary recurrence contributor
  relationship: background
